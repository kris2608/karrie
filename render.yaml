services:
  - type: web
    runtime: static
    name: karrieapp
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # WhatsApp/Facebook fetch /s/{id} for Open Graph; API returns meta then sends people to /l/{id}.
      - type: redirect
        source: /s/*
        destination: https://karrie-api.onrender.com/l/*
      # Public marketing pages (static HTML) before the SPA catch-all.
      - type: rewrite
        source: /ontdek
        destination: /ontdek.html
      - type: rewrite
        source: /over
        destination: /over.html
      - type: rewrite
        source: /boodschappen-met-kinderen
        destination: /boodschappen-met-kinderen.html
      - type: rewrite
        source: /boodschappenlijstje-met-plaatjes
        destination: /boodschappenlijstje-met-plaatjes.html
      # Extensionless sitemap alias (avoids Cloudflare .xml MIME quirks for some crawlers).
      - type: rewrite
        source: /sitemap
        destination: /sitemap.xml
      # Existing files (robots.txt, sitemap.xml, *.html) are served before rewrites.
      # Catch-all only applies when no file exists at the request path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /ontdek.html
        name: Cache-Control
        value: no-cache
      - path: /over.html
        name: Cache-Control
        value: no-cache
      - path: /boodschappen-met-kinderen.html
        name: Cache-Control
        value: no-cache
      - path: /boodschappenlijstje-met-plaatjes.html
        name: Cache-Control
        value: no-cache
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=300
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=300
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /l/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /s/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /toevoegen
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /controleren
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /winkel
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /klaar
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: VITE_API_ORIGIN
        value: https://karrie-api.onrender.com
      # Umami Cloud, read at build time; both values end up public in index.html.
      - key: UMAMI_SCRIPT_URL
        sync: false
      - key: UMAMI_WEBSITE_ID
        sync: false

  - type: web
    runtime: node
    name: karrie-api
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: OPENAI_API_KEY
        sync: false
      # Signs short-lived app tokens. Generate a long random string; do not commit it.
      - key: APP_TOKEN_SECRET
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_IMAGE_DETAIL
        value: auto
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: ALLOWED_ORIGINS
        value: https://karrie.eu,https://www.karrie.eu,https://karrieapp.onrender.com
      - key: REQUIRE_ORIGIN
        value: "true"
      - key: LIMIT_PER_IP_HOUR
        value: "20"
      - key: LIMIT_PER_IP_DAY
        value: "60"
      - key: LIMIT_DAILY_REQUESTS
        value: "300"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: OFF_USER_AGENT
        value: Karrie/1.0 (https://karrie.eu)
      - key: BARCODE_WEB_SEARCH
        value: "on"
      - key: BARCODE_DAILY_BUDGET_USD
        value: "0.5"
      - key: BARCODE_LIMIT_PER_IP_HOUR
        value: "60"
      - key: BARCODE_LIMIT_PER_IP_DAY
        value: "200"
      - key: BARCODE_LIMIT_DAILY_REQUESTS
        value: "1000"
      - key: OFFERS
        value: "on"
      - key: PRIJSPROFEET_USER_AGENT
        value: Karrie/1.0 (+https://karrie.eu)
      - key: PRIJSPROFEET_API_KEY
        sync: false
      - key: PRIJSPROFEET_IMAGES
        value: "on"
      # Name photo search for typed products: Open Food Facts after PrijsProfeet ("off" switches it off).
      - key: OFF_NAME_SEARCH
        value: "on"
      # Postgres for catalog candidates (e.g. a free Neon database); without it they live in memory.
      - key: CANDIDATES_DATABASE_URL
        sync: false
      - key: OFFERS_LIMIT_PER_IP_HOUR
        value: "300"
      - key: OFFERS_LIMIT_PER_IP_DAY
        value: "1500"
      # Short Dutch shopping voice. Default is Edge neural Maarten. Set VOICE_PROVIDER=openai to use Realtime instead.
      - key: VOICE_PROVIDER
        value: edge
      - key: EDGE_VOICE
        value: nl-NL-MaartenNeural
      - key: EDGE_VOICE_RATE
        value: "+8%"
      - key: EDGE_VOICE_PITCH
        value: "+16Hz"
      - key: OPENAI_VOICE_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_VOICE
        value: coral
      - key: VOICE_LIMIT_PER_IP_HOUR
        value: "40"
      - key: VOICE_LIMIT_PER_IP_DAY
        value: "120"
      - key: VOICE_LIMIT_DAILY_REQUESTS
        value: "2000"
      - key: VOICE_DAILY_BUDGET_USD
        value: "1"
      # gpt-realtime-2.1 text + audio token prices (USD per 1M). Audio output is billed separately.
      - key: PRICE_VOICE_INPUT_PER_MTOK
        value: "4"
      - key: PRICE_VOICE_CACHED_INPUT_PER_MTOK
        value: "0.4"
      - key: PRICE_VOICE_OUTPUT_PER_MTOK
        value: "24"
      - key: PRICE_VOICE_AUDIO_OUTPUT_PER_MTOK
        value: "64"
