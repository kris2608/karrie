services:
  - type: web
    runtime: static
    name: karrieapp
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_ORIGIN
        value: https://karrie-api.onrender.com
      # Umami Cloud, read at build time; both values end up public in index.html.
      - key: UMAMI_SCRIPT_URL
        sync: false
      - key: UMAMI_WEBSITE_ID
        sync: false

  - type: web
    runtime: node
    name: karrie-api
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_IMAGE_DETAIL
        value: auto
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: ALLOWED_ORIGINS
        value: https://karrie.eu,https://www.karrie.eu,https://karrieapp.onrender.com
      - key: REQUIRE_ORIGIN
        value: "true"
      - key: LIMIT_PER_IP_HOUR
        value: "20"
      - key: LIMIT_PER_IP_DAY
        value: "60"
      - key: LIMIT_DAILY_REQUESTS
        value: "300"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: OFF_USER_AGENT
        value: Karrie/1.0 (https://karrie.eu)
      - key: BARCODE_WEB_SEARCH
        value: "on"
      - key: BARCODE_DAILY_BUDGET_USD
        value: "0.5"
      - key: BARCODE_LIMIT_PER_IP_HOUR
        value: "60"
      - key: BARCODE_LIMIT_PER_IP_DAY
        value: "200"
      - key: BARCODE_LIMIT_DAILY_REQUESTS
        value: "1000"
      - key: OFFERS
        value: "on"
      - key: PRIJSPROFEET_USER_AGENT
        value: Karrie/1.0 (+https://karrie.eu)
      - key: PRIJSPROFEET_API_KEY
        sync: false
      - key: OFFERS_LIMIT_PER_IP_HOUR
        value: "300"
      - key: OFFERS_LIMIT_PER_IP_DAY
        value: "1500"
